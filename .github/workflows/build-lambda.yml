name: Build and Deploy Lambda

on:
  push:
    branches:
      - master
    paths:
      - 'lambda/membership-api-members/**'
      - 'lambda/member-lookups/**'
      - 'lambda/payments-api-payments/**'
      - 'lambda/payments-api-import/**'
      - 'lambda/payment-reports/**'
      - 'lambda/gift-aid-members/**'
      - 'lambda/gift-aid/**'
      - '.github/workflows/build-lambda.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # ---------------------------------------------------------
      # Build membership-api-members
      # ---------------------------------------------------------

      - name: Build members Lambda package
        run: |
          cd lambda/membership-api-members
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create members deployment ZIP
        run: |
          cd lambda/membership-api-members/package
          zip -r ../lambda.zip .

      # ---------------------------------------------------------
      # Build member-lookups
      # ---------------------------------------------------------

      - name: Build member-lookups Lambda package
        run: |
          cd lambda/member-lookups
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create member-lookups deployment ZIP
        run: |
          cd lambda/member-lookups/package
          zip -r ../lambda.zip .

      # ---------------------------------------------------------
      # Build payments-api-payments
      # ---------------------------------------------------------

      - name: Build payments-api-payments Lambda package
        run: |
          cd lambda/payments-api-payments
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create payments deployment ZIP
        run: |
          cd lambda/payments-api-payments/package
          zip -r ../lambda.zip .

      # ---------------------------------------------------------
      # Build payments-api-import
      # ---------------------------------------------------------

      - name: Build payments-api-import Lambda package
        run: |
          cd lambda/payments-api-import
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create payments-api-import deployment ZIP
        run: |
          cd lambda/payments-api-import/package
          zip -r ../lambda.zip .

      # ---------------------------------------------------------
      # Build payment-reports
      # ---------------------------------------------------------

      - name: Build payment-reports Lambda package
        run: |
          cd lambda/payment-reports
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create payment-reports deployment ZIP
        run: |
          cd lambda/payment-reports/package
          zip -r ../lambda.zip .

      # ---------------------------------------------------------
      # Build gift-aid-members
      # ---------------------------------------------------------

      - name: Build gift-aid-members Lambda package
        run: |
          cd lambda/gift-aid-members
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create gift-aid-members deployment ZIP
        run: |
          cd lambda/gift-aid-members/package
          zip -r ../lambda.zip .

      # ---------------------------------------------------------
      # Build gift-aid
      # ---------------------------------------------------------

      - name: Build gift-aid Lambda package
        run: |
          cd lambda/gift-aid
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create gift-aid deployment ZIP
        run: |
          cd lambda/gift-aid/package
          zip -r ../lambda.zip .



      # ---------------------------------------------------------
      # AWS credentials
      # ---------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      # ---------------------------------------------------------
      # Deploy members Lambda
      # ---------------------------------------------------------

      - name: Deploy members Lambda
        run: |
          aws lambda update-function-code \
            --function-name membership-api-members \
            --zip-file fileb://lambda/membership-api-members/lambda.zip

      # ---------------------------------------------------------
      # Deploy member-lookups Lambda
      # ---------------------------------------------------------

      - name: Deploy member-lookups Lambda
        run: |
          aws lambda update-function-code \
            --function-name member-lookups \
            --zip-file fileb://lambda/member-lookups/lambda.zip

      # ---------------------------------------------------------
      # Deploy payments-api-payments Lambda
      # ---------------------------------------------------------

      - name: Deploy payments-api-payments Lambda
        run: |
          aws lambda update-function-code \
            --function-name payments-api-payments \
            --zip-file fileb://lambda/payments-api-payments/lambda.zip

      # ---------------------------------------------------------
      # Deploy payments-api-import Lambda
      # ---------------------------------------------------------

      - name: Deploy payments-api-import Lambda
        run: |
          aws lambda update-function-code \
            --function-name payments-api-import \
            --zip-file fileb://lambda/payments-api-import/lambda.zip

      # ---------------------------------------------------------
      # Deploy payment-reports Lambda
      # ---------------------------------------------------------

      - name: Deploy payment-reports Lambda
        run: |
          aws lambda update-function-code \
            --function-name payment-reports \
            --zip-file fileb://lambda/payment-reports/lambda.zip

      # ---------------------------------------------------------
      # Deploy gift-aid-members Lambda
      # ---------------------------------------------------------

      - name: Deploy gift-aid-members Lambda
        run: |
          aws lambda update-function-code \
            --function-name gift-aid-members \
            --zip-file fileb://lambda/gift-aid-members/lambda.zip

      # ---------------------------------------------------------
      # Deploy gift-aid Lambda
      # ---------------------------------------------------------

      - name: Deploy gift-aid Lambda
        run: |
          aws lambda update-function-code \
            --function-name gift-aid \
            --zip-file fileb://lambda/gift-aid/lambda.zip


