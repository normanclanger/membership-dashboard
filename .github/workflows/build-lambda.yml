name: Build and Deploy Lambda

on:
  push:
    branches:
      - master
    paths:
      - 'lambda/membership-api-members/**'
      - '.github/workflows/build-lambda.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Lambda package
        run: |
          cd lambda/membership-api-members
          rm -rf package
          mkdir package

          pip install \
            --platform manylinux2014_x86_64 \
            --target package \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r requirements.txt

          cp lambda_function.py database.py responses.py package/

      - name: Create deployment ZIP
        run: |
          cd lambda/membership-api-members/package
          zip -r ../lambda.zip .

      - name: Show GitHub repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "Repository owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Ref: $GITHUB_REF"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name membership-api-members \
            --zip-file fileb://lambda/membership-api-members/lambda.zip
