{{ define "main" }}

<h1>Payment Import</h1>

<div id="payment-import-error"
     class="alert alert-danger"
     hidden>
</div>

<div class="table-container">

    <table class="table table-striped mb-0">

        <tbody id="payment-import-detail">

            <tr>
                <th>Import</th>
                <td>Loading...</td>
            </tr>

        </tbody>

    </table>

</div>

<h2 class="mt-4">Statement Lines</h2>

<div class="table-responsive">

    <table
        id="payment-import-lines"
        class="table table-striped mb-0"
    >

        <thead>
            <tr>
                <th>Reference</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="payment-import-lines-body">

            <tr>
                <td colspan="6">
                    Loading...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<div class="page-actions mt-3">

    <a
        href="/payments/imports/"
        class="btn btn-secondary"
    >
        Back to imports
    </a>

</div>

<script
    type="module"
    src="/js/payment-import.js"
></script>

{{ end }}
