{{ define "main" }}

<div class="container mt-4">

    <h1>
        Payment Reports
    </h1>


<div class="list-group">

    <a
        id="full-payment-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        Full payment list
    </a>


    <a
        id="ne-payment-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        NE payment list
    </a>


    <a
        id="nw-payment-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        NW payment list
    </a>


    <a
        id="se-payment-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        SE payment list
    </a>


    <a
        id="sw-payment-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        SW payment list
    </a>

</div>
</div>
<div class="container mt-4">

    <h1>
        Delinquent Payer Reports
    </h1>


<div class="list-group">

    <a
        id="full-delinquent-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        Full Delinquent list
    </a>


    <a
        id="ne-delinquent-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        NE Delinquent list
    </a>


    <a
        id="nw-delinquent-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        NW Delinquent list
    </a>


    <a
        id="se-delinquent-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        SE Delinquent list
    </a>


    <a
        id="sw-delinquent-list-link"
        href="#"
        class="list-group-item list-group-item-action"
    >
        SW Delinquent list
    </a>

</div>


<script>

    const currentYear =
        new Date().getFullYear();


    const reportLinks = {

        "full-payment-list-link":
            "",

        "ne-payment-list-link":
            "NE",

        "nw-payment-list-link":
            "NW",

        "se-payment-list-link":
            "SE",

        "sw-payment-list-link":
            "SW"
	};
	
    const delinquentLinks = {	
	
        "full-delinquent-list-link":
            "",

        "ne-delinquent-list-link":
            "NE",

        "nw-delinquent-list-link":
            "NW",

        "se-delinquent-list-link":
            "SE",

        "sw-delinquent-list-link":
            "SW"			

    };


    Object.entries(
        reportLinks
    ).forEach(
        ([id, district]) => {

            const link =
                document.getElementById(
                    id
                );


            if (!link) {

                return;
            }


            let href =
                `/reportspayments/?calendar_year=${currentYear}`;


            if (district) {

                href +=
                    `&district=${district}`;
            }


            link.href =
                href;
        }
    );

    Object.entries(
        delinquentLinks
    ).forEach(
        ([id, district]) => {

            const link =
                document.getElementById(
                    id
                );


            if (!link) {

                return;
            }


            let href =
                `/lost-payers/?calendar_year=${currentYear}`;


            if (district) {

                href +=
                    `&district=${district}`;
            }


            link.href =
                href;
        }
    );


</script>


{{ end }}
