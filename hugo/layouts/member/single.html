{{ define "main" }}

<h1>Member</h1>

<div class="table-container">

    <table class="table table-striped mb-0">

        <tbody id="member-detail">

            <tr>
                <th>Membership</th>
                <td>Loading...</td>
            </tr>

        </tbody>

    </table>

<div class="page-actions">

    <a
        id="edit-member-link"
        href="#"
        class="btn btn-primary"
    >
        Edit member
    </a>

    <a
        href="/members/"
        class="btn btn-secondary"
    >
        Back to members
    </a>

</div>
</div>
<script>
document.addEventListener("authentication-ready", async () => {

    const params =
        new URLSearchParams(window.location.search);

    const memberId =
        params.get("id");

    const editLink =
        document.querySelector("#edit-member-link");

    if (editLink && memberId) {
        editLink.href =
            `/patch-member/?id=${memberId}`;
    }

    if (!memberId) {
        document.querySelector("#member-detail").innerHTML =
            "<p>No member ID was supplied.</p>";
        return;
    }

    try {

        const user =
            window.currentUser;

        if (!user || !user.access_token) {
            throw new Error("No authenticated user");
        }

        const response =
            await fetch(
                `https://ns6zyyxykl.execute-api.eu-north-1.amazonaws.com/api/members/${memberId}`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${user.access_token}`
                    }
                }
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        const member =
            data.member;

        document.querySelector(
            "#member-detail"
        ).innerHTML = `

    <tr>
        <th>Membership</th>
        <td>${member.membership_number}</td>
    </tr>

    <tr>
        <th>First name</th>
        <td>${member.first_name}</td>
    </tr>

    <tr>
        <th>Surname</th>
        <td>${member.surname}</td>
    </tr>

    <tr>
        <th>Tower</th>
        <td>
        ${member.tower
            ? `${member.tower.name} (${member.district?.code || "-"})`
            : "-"}
        </td>
    </tr>

    <tr>
        <th>Date of birth</th>
        <td>${member.date_of_birth || "-"}
</td>
    </tr>

    <tr>
        <th>Membership class</th>
        <td>
            ${member.membership_class
                ? member.membership_class.name :"-"}
        </td>
    </tr>

    <tr>

    <tr>
        <th>Member type</th>
        <td>
            ${member.full_member_type
                ? member.full_member_type.name :"-"}
        </td>
    </tr>

    <tr>
        <th>Membership status</th>
        <td>
            ${member.membership_status
                ? member.membership_status.name :"-"}
        </td>
    </tr>

        `;

    } catch (error) {

        console.error(error);

        document.querySelector(
            "#member-detail"
        ).innerHTML =
            "<p>Unable to load member.</p>";
    }
});
</script>

{{ end }}
