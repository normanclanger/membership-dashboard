{{ define "main" }}

<h1>Edit Member</h1>

<div
    id="patch-member-loading"
>
    Loading member...
</div>

<div
    id="patch-member-error"
    hidden
    class="alert alert-danger"
>
</div>

<div class="table-container">

    <form id="patch-member-form" hidden>

        <table class="table table-striped mb-0">

            <tbody>

                <tr>
                    <th>Membership number</th>
                    <td>
                        <input
                            type="text"
                            id="membership_number"
                            name="membership_number"
                            class="form-control"
                            readonly
                        >
                    </td>
                </tr>

                <tr>
                    <th>First name</th>
                    <td>
                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            class="form-control"
                            required
                        >
                    </td>
                </tr>

                <tr>
                    <th>Surname</th>
                    <td>
                        <input
                            type="text"
                            id="surname"
                            name="surname"
                            class="form-control"
                            required
                        >
                    </td>
                </tr>

                <tr>
                    <th>Tower</th>
                    <td>
                        <select
                            id="tower_id"
                            name="tower_id"
                            class="form-select"
                            required
                        >
                            <option value="">Loading...</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <th>Date of birth</th>
                    <td>
                        <input
                            type="date"
                            id="date_of_birth"
                            name="date_of_birth"
                            class="form-control"
                        >
                    </td>
                </tr>

                <tr>
                    <th>Membership class</th>
                    <td>
                        <select
                            id="membership_class_id"
                            name="membership_class_id"
                            class="form-select"
                            required
                        >
                            <option value="">Loading...</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <th>Member type</th>
                    <td>
                        <select
                            id="full_member_type_id"
                            name="full_member_type_id"
                            class="form-select"
                        >
                            <option value="">
                                Please select...
                            </option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <th>Membership status</th>
                    <td>
                        <select
                            id="membership_status_id"
                            name="membership_status_id"
                            class="form-select"
                            required
                        >
                            <option value="">Loading...</option>
                        </select>
                    </td>
                </tr>

            </tbody>

        </table>

        <p></p>

        <div class="page-actions">

            <button
                type="submit"
                id="patch-member-button"
                class="btn btn-primary"
            >
                Save changes
            </button>

            <a
                href="/members/"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

<script
    type="module"
    src="/js/patch-member.js"
></script>

{{ end }}
