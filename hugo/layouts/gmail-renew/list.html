
{{ define "main" }}

<script type="module">
    import { requireLogin } from "/js/auth.js";

    document.addEventListener("DOMContentLoaded", async () => {
        const status = document.getElementById("gmail-renew-status");
        const button = document.getElementById("gmail-renew-button");

        try {
            const user = await requireLogin();

            if (!user) return;

            const groups = user.profile["cognito:groups"] || [];

            if (!groups.includes("ApplicationAdmin")) {
                status.className = "alert alert-danger";
                status.textContent =
                    "You are not authorised to renew Gmail access.";

                button.disabled = true;
                return;
            }

            status.className = "alert alert-success";
            status.textContent =
                "You are authorised to renew Gmail access.";

            button.disabled = false;

            button.addEventListener("click", async () => {
                try {
                    button.disabled = true;
                    status.className = "alert alert-info";
                    status.textContent = "Starting Gmail authorisation...";

                    const response = await fetch(
                        window.API_BASE_URL + "/api/gmail-renew/start",
                        {
                            headers: {
                                "Authorization": "Bearer " + user.access_token
                            }
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error || "Unable to start renewal."
                        );
                    }

                    if (!data.authorization_url) {
                        throw new Error(
                            "Google authorisation URL was not returned."
                        );
                    }

                    console.log("Google URL:", data.authorization_url);
                    window.open(data.authorization_url, "_blank");

                } catch (error) {
                    console.error("Gmail renewal failed:", error);

                    status.className = "alert alert-danger";
                    status.textContent = error.message;

                    button.disabled = false;
                }
            });

        } catch (error) {
            console.error("Authentication failed:", error);
            status.className = "alert alert-danger";
            status.textContent =
                "Unable to verify your authorisation.";
        }
    });

</script>

<div class="container mt-4">

    <h1>
        {{ .Title }}
    </h1>

    <div
        id="gmail-renew-status"
        class="alert alert-info"
    >
        Check the status of your Gmail authorisation here.
    </div>

    <div class="mt-4">

        <p>
            Your Gift Aid email service requires periodic
            renewal of its Gmail authorisation.
        </p>

        <p>
            Click the button below to renew it. You will be
            taken to Google to confirm access.
        </p>

        <button
            id="gmail-renew-button"
            class="btn btn-primary"
            type="button"
        >
            Renew Gmail authorisation
        </button>

    </div>

</div>

{{ end }}
