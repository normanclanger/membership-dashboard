<!DOCTYPE html>
<html lang="en">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members</title>
</head>
<body>

    

<main>
    <h1 id="members">Members</h1>
<p>This page will display the membership data.</p>


    <table id="members">
        <thead>
            <tr>
                <th>Membership</th>
                <th>First name</th>
                <th>Surname</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="3">Loading...</td>
            </tr>
        </tbody>
    </table>
</main>

<script>
fetch("https://ns6zyyxykl.execute-api.eu-north-1.amazonaws.com/Dev/api/members")
    .then(response => response.json())
    .then(data => {
        const tbody = document.querySelector("#members tbody");

        tbody.innerHTML = "";

        data.members.forEach(member => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${member.membership_number}</td>
                <td>${member.first_name}</td>
                <td>${member.surname}</td>
            `;

            tbody.appendChild(row);
        });
    })
    .catch(error => {
        console.error(error);

        document.querySelector("#members tbody").innerHTML =
            '<tr><td colspan="3">Unable to load members.</td></tr>';
    });
</script>



</body>
</html>
